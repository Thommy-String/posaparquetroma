  (function preloadRouteCriticalImages() {

        { href: '/service-images/spc-hero-before-640.webp', fetchPriority: 'high' },

      ]

    var images = routePreloads[normalizedPath];
    if (!images) return;

    for (var i = 0; i < images.length; i += 1) {
      var image = images[i];
      var link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = image.href;
      if (image.fetchPriority) {
        link.setAttribute('fetchpriority', image.fetchPriority);
      }
      document.head.appendChild(link);
    }
  })();

  <!-- Cookie Banner: lo script PRIMA del banner definisce le funzioni globali -->
  <script>
  function _cb_emit(v){try{window.dispatchEvent(new CustomEvent('gdpr-consent-changed',{detail:{value:v}}));}catch(e){}}
  function _cb_set(n,v){var d=new Date();d.setTime(d.getTime()+31536e6);document.cookie=n+'='+v+';expires='+d.toUTCString()+';path=/;SameSite=Lax';_cb_emit(v);}
  function _cb_hide(){var b=document.getElementById('cookie-banner');if(b)b.style.cssText='display:none!important';}
  function _cb_grant(){gtag('consent','update',{'ad_storage':'granted','ad_user_data':'granted','ad_personalization':'granted','analytics_storage':'granted','functionality_storage':'granted','personalization_storage':'granted'});}
  function _cb_deny(){gtag('consent','update',{'ad_storage':'denied','ad_user_data':'denied','ad_personalization':'denied','analytics_storage':'denied','functionality_storage':'denied','personalization_storage':'denied'});}
  function _cb_accept(){_cb_hide();_cb_set('gdpr_consent','accepted');try{if(typeof gtag==='function')_cb_grant();}catch(e){}}
  function _cb_decline(){_cb_hide();_cb_set('gdpr_consent','declined');try{if(typeof gtag==='function')_cb_deny();}catch(e){}}
  function _cb_read(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?m[1]:null;}
  // Se il cookie esiste già, riapplica lo stato di consenso e nascondi il banner.
  // La chiamata update è differita (setTimeout 2000ms) per dare tempo a GTM di caricare
  // completamente e registrare il suo listener per il consenso (wait_for_update:2000).
  var _cb_existing=_cb_read('gdpr_consent');
  if(_cb_existing){
    setTimeout(function(){
      if(_cb_existing==='accepted')_cb_grant();
      else _cb_deny();
    },2000);
    document.write('<style>#cookie-banner{display:none!important}</style>');
  }
  </script>
